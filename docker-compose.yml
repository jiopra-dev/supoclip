services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        - NEXT_PUBLIC_APP_URL=https://supoclip.jiop.cloud
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_API_URL=https://supoclip.jiop.cloud
      - BACKEND_INTERNAL_URL=http://backend:8000
      - NEXT_PUBLIC_SELF_HOST=true
      - NEXT_PUBLIC_APP_URL=https://supoclip.jiop.cloud
      - BACKEND_AUTH_SECRET=supoclip_jiop_auth_token_987654321
      - DATABASE_URL=postgresql://supoclip:supoclip_password@postgres:5432/supoclip
      - BETTER_AUTH_SECRET=supoclip_jiop_secret_key_1234567890_secure
      - BETTER_AUTH_URL=https://supoclip.jiop.cloud
      - BETTER_AUTH_TRUST_HOST=true
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    platform: linux/amd64
    command: [".venv/bin/uvicorn", "src.main_refactored:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - uploads:/app/uploads
      - clips:/app/clips
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://supoclip:supoclip_password@postgres:5432/supoclip
      - BACKEND_AUTH_SECRET=supoclip_jiop_auth_token_987654321
      - TEMP_DIR=/app/uploads
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ASSEMBLY_AI_API_KEY=${ASSEMBLY_AI_API_KEY}
      - LLM=${LLM:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEFAULT_PROCESSING_MODE=fast
      - SELF_HOST=true
      - CORS_ORIGINS=https://supoclip.jiop.cloud
      - GOOGLE_API_KEY=AQ.Ab8RN6LhGKdF5AvABhSlh-m9IR_FKe91jKU0PMr4EJMeDYoHFw
      - YOUTUBE_DATA_API_KEY=AQ.Ab8RN6LhGKdF5AvABhSlh-m9IR_FKe91jKU0PMr4EJMeDYoHFw
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/db"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    platform: linux/amd64
    command: [".venv/bin/arq", "src.workers.tasks.WorkerSettings"]
    volumes:
      - uploads:/app/uploads
      - clips:/app/clips
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://supoclip:supoclip_password@postgres:5432/supoclip
      - BACKEND_AUTH_SECRET=supoclip_jiop_auth_token_987654321
      - TEMP_DIR=/app/uploads
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ASSEMBLY_AI_API_KEY=${ASSEMBLY_AI_API_KEY}
      - LLM=${LLM:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEFAULT_PROCESSING_MODE=fast
      - SELF_HOST=true
      - GOOGLE_API_KEY=AQ.Ab8RN6LhGKdF5AvABhSlh-m9IR_FKe91jKU0PMr4EJMeDYoHFw
      - YOUTUBE_DATA_API_KEY=AQ.Ab8RN6LhGKdF5AvABhSlh-m9IR_FKe91jKU0PMr4EJMeDYoHFw
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: supoclip
      POSTGRES_USER: supoclip
      POSTGRES_PASSWORD: supoclip_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supoclip -d supoclip"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  uploads:
    driver: local
  clips:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local
