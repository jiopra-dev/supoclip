services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://supoclip.jiop.cloud/api-backend
        - NEXT_PUBLIC_APP_URL=https://supoclip.jiop.cloud
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_API_URL=https://supoclip.jiop.cloud/api-backend
      - BACKEND_INTERNAL_URL=http://backend:8000
      - NEXT_PUBLIC_SELF_HOST=true
      - NEXT_PUBLIC_APP_URL=https://supoclip.jiop.cloud
      - DATABASE_URL=postgresql://supoclip:supoclip_password@postgres:5432/supoclip
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-supoclip_jiop_secret_key_12345}
      - BETTER_AUTH_URL=https://supoclip.jiop.cloud
      - BETTER_AUTH_TRUST_HOST=true
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3107/api/auth/get-session"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - default
      - easypanel
    labels:
      - traefik.enable=true
      - traefik.http.routers.supoclip.rule=Host(`supoclip.jiop.cloud`)
      - traefik.http.services.supoclip.loadbalancer.server.port=3107

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    platform: linux/amd64
    command: [".venv/bin/uvicorn", "src.main_refactored:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - uploads:/app/uploads
      - clips:/app/clips
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://supoclip:supoclip_password@postgres:5432/supoclip
      - TEMP_DIR=/app/uploads
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ASSEMBLY_AI_API_KEY=${ASSEMBLY_AI_API_KEY}
      - LLM=${LLM:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEFAULT_PROCESSING_MODE=fast
      - SELF_HOST=true
      - CORS_ORIGINS=https://supoclip.jiop.cloud
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/db"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - default
      - easypanel
    labels:
      - traefik.enable=true
      - traefik.http.routers.supoclip-api.rule=Host(`supoclip.jiop.cloud`) && PathPrefix(`/api-backend`)
      - traefik.http.middlewares.supoclip-api-strip.stripprefix.prefixes=/api-backend
      - traefik.http.routers.supoclip-api.middlewares=supoclip-api-strip
      - traefik.http.services.supoclip-api.loadbalancer.server.port=8000

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    platform: linux/amd64
    command: [".venv/bin/arq", "src.workers.tasks.WorkerSettings"]
    volumes:
      - uploads:/app/uploads
      - clips:/app/clips
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://supoclip:supoclip_password@postgres:5432/supoclip
      - TEMP_DIR=/app/uploads
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ASSEMBLY_AI_API_KEY=${ASSEMBLY_AI_API_KEY}
      - LLM=${LLM:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEFAULT_PROCESSING_MODE=fast
      - SELF_HOST=true
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: supoclip
      POSTGRES_USER: supoclip
      POSTGRES_PASSWORD: supoclip_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supoclip -d supoclip"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  uploads:
    driver: local
  clips:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local

networks:
  default:
  easypanel:
    external: true
